[tool.poetry]
name = "payment-service"
version = "0.1.0"
description = ""
authors = ["KapHullloK <kirillov2136@yandex.ru>"]
readme = "README.md"
packages = [{include = "payment_service"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = ">=0.115,<1"
pydantic = ">=2,<3"
email-validator = ">=2.3,<3"
pydantic-settings = ">=2,<3"
sqlalchemy = {version = ">=2,<3", extras = ["asyncio"]}
asyncpg = ">=0.29,<1"
alembic = ">=1.13,<2"
uvicorn = ">=0.30,<1"

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<10"
pytest-asyncio = ">=0.24,<2"
httpx = ">=0.27,<1"
testcontainers = {version = ">=4,<5", extras = ["postgres"]}
ruff = ">=0.8,<1"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
